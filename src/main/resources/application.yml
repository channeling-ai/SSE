server:
  port: 8081

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DATABASE:channeling}
    username: ${PG_USER}
    password: ${PG_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      timeout: 5000ms
      port: 6379

jwt:
  secret: ${JWT_SECRET}
  access:
    expiration: 3600      # ? ??, 60min
    header: Authorization

# K8s liveness/readiness probe용 actuator 설정
# probes.enabled=true → /actuator/health/{liveness,readiness} 그룹 활성화
# (readiness는 readinessState만 → DB/Redis 장애로 파드가 재시작되지 않게 함)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never


